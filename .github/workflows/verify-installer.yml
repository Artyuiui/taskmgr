name: Verify installer

# Manual check that the one-line installer works against the latest release
# on common distros (prebuilt path on glibc distros, source build on Alpine).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install (empty = latest)"
        required: false
        default: ""

jobs:
  verify:
    name: install.sh on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null" }
          - { image: "debian:12",    prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null" }
          - { image: "fedora:40",    prep: "true" }
          - { image: "archlinux",    prep: "true" }
          - { image: "alpine:3.20",  prep: "apk add --no-cache curl >/dev/null" }
    steps:
      - name: Run the one-liner
        run: |
          docker run --rm -e TASKMGR_VERSION="${{ inputs.version }}" ${{ matrix.image }} sh -ec '
            ${{ matrix.prep }}
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            taskmgr -v
          '
