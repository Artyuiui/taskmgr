name: Release

# Pushing a tag like v0.1.0 builds x86_64 + aarch64 binaries and attaches them
# (plus SHA256SUMS) to a GitHub Release. install.sh downloads from here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for `git describe`
      # Build inside Debian 11 (glibc 2.31, ncurses 6.2) so the binary runs on
      # Ubuntu 20.04+, Debian 11+, RHEL 9+, Fedora, Arch ... anything newer.
      - name: Build in Debian 11 container
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:11 sh -ec '
            apt-get update -qq
            apt-get install -y -qq build-essential libncursesw5-dev pkg-config git >/dev/null
            git config --global --add safe.directory /src
            make release VERSION="${GITHUB_REF_NAME}"
            ./taskmgr -v
          '
          mv taskmgr taskmgr-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: taskmgr-linux-${{ matrix.arch }}
          path: taskmgr-linux-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum taskmgr-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
