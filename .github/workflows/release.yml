name: Release

# Pushing a tag like v0.1.0 builds x86_64 + aarch64 binaries, attaches them
# (plus SHA256SUMS) to a GitHub Release, then runs install.sh on several
# distros to prove the one-liner works. install.sh downloads from here.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      # Build inside Debian 11 (glibc 2.31, ncurses 6.2) so the binary runs on
      # Ubuntu 20.04+, Debian 11+, RHEL 9+, Fedora, Arch ... anything newer.
      # Bullseye is end-of-life, so its packages live on archive.debian.org.
      - name: Build in Debian 11 container
        run: |
          docker run --rm -e GITHUB_REF_NAME -v "$PWD":/src -w /src debian:11 sh -ec '
            printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq --no-install-recommends gcc make libc6-dev libncursesw5-dev pkg-config >/dev/null
            make release VERSION="$GITHUB_REF_NAME"
            ./taskmgr -v
            ldd ./taskmgr
          '
          mv taskmgr taskmgr-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: taskmgr-linux-${{ matrix.arch }}
          path: taskmgr-linux-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum taskmgr-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  verify-installer:
    name: install.sh on ${{ matrix.image }}
    needs: release
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null" , expect: "prebuilt" }
          - { image: "debian:12",    prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null" , expect: "prebuilt" }
          - { image: "fedora:40",    prep: "true" , expect: "prebuilt" }
          - { image: "archlinux",    prep: "true" , expect: "prebuilt" }   # curl ships in the base image; partial -Sy upgrades break pacman
          - { image: "alpine:3.20",  prep: "apk add --no-cache curl >/dev/null" , expect: "source" }   # musl -> source build path
    steps:
      - name: Run the one-liner
        run: |
          docker run --rm -e TASKMGR_VERSION="$GITHUB_REF_NAME" ${{ matrix.image }} sh -ec '
            ${{ matrix.prep }}
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh 2>&1 | tee /tmp/install.log
            taskmgr -v
            case "${{ matrix.expect }}" in
              prebuilt) grep -q "checksum OK" /tmp/install.log || { echo "expected the prebuilt binary path"; exit 1; } ;;
              source)   grep -q "building"    /tmp/install.log || { echo "expected the source-build path";   exit 1; } ;;
            esac
          '
